<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little World For Disha ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Quicksand',sans-serif;
background:linear-gradient(#fdebf2,#fff5fa);
display:flex;
align-items:center;
justify-content:center;
}

.hearts span{
position:absolute;
font-size:25px;
animation:float 10s linear infinite;
opacity:.35;
}

@keyframes float{
0%{
transform:translateY(110vh) rotate(0);
}
100%{
transform:translateY(-20vh) rotate(360deg);
}
}

.card{
background:rgba(255,255,255,.75);
backdrop-filter:blur(10px);
padding:35px 25px;
border-radius:30px;
width:85%;
max-width:380px;
text-align:center;
box-shadow:0 15px 40px #f5b7ca;
animation:breathe 3s infinite;
}

@keyframes breathe{
50%{
transform:translateY(-10px);
}
}

h1{
font-family:'Pacifico',cursive;
color:#ff6f9c;
font-size:32px;
margin-bottom:20px;
}

p{
color:#555;
font-size:18px;
line-height:1.6;
}

button{
margin-top:25px;
border:none;
padding:15px 35px;
border-radius:50px;
font-size:18px;
cursor:pointer;
background:#ff8fb1;
color:white;
}

button:hover{
transform:scale(1.1);
}

#story{
display:none;
position:absolute;
text-align:center;
padding:25px;
}

.moon{
font-size:100px;
animation:bounce 2s infinite;
}

@keyframes bounce{
50%{
transform:translateY(-20px);
}
}

.love{
font-family:'Pacifico';
font-size:40px;
color:#ff6f9c;
animation:appear 3s forwards;
}

@keyframes appear{
from{
opacity:0;
transform:scale(.5);
}
to{
opacity:1;
transform:scale(1);
}
}

.character{
font-size:70px;
margin:20px;
}
</style>
</head>


<body>


<div class="hearts">
<span style="left:10%">💖</span>
<span style="left:30%;animation-delay:2s">🌸</span>
<span style="left:50%;animation-delay:4s">💕</span>
<span style="left:70%;animation-delay:1s">🦋</span>
<span style="left:90%;animation-delay:3s">✨</span>
</div>


<div class="card" id="card">

<h1>
Hi Disha 🌸
</h1>

<p>
Someone made a tiny little world...
<br><br>
just for you.
<br><br>
Do you dare to enter Rohan's heart? ❤️
</p>


<button onclick="enter()">
Yes ❤️
</button>

</div>


<div id="story">

<div class="character">
👦🏻 💐 👧🏻
</div>

<div class="moon">
🌙✨
</div>


<div class="love">
I Love You<br>
To The Moon<br>
And Back ❤️
</div>

<p>
Maybe our story is just beginning...
<br><br>
but I'm happy that you're a part of it.
<br><br>
— Rohan ❤️
</p>

</div>



<script>

function enter(){

document.getElementById("card").style.display="none";

document.getElementById("story").style.display="block";

}

</script>


</body>
</html>
